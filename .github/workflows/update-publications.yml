name: Update publications from ADS

on:
  schedule:
    # daily at 06:17 UTC (early morning in Toronto)
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install Pillow

      - name: Update publication list
        env:
          # Optional: repository secret with a personal ADS API token.
          # Without it the script falls back to the anonymous ADS UI token.
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
        run: python scripts/update_pubs.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubs/pubs.json pubs/figures
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update publications from ADS library"
            git push
          fi
